name: github actions + docker project

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]
  

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: set version
        run: mvn -B versions:set -DnewVersion=1.0.${{ github.run_number }} -DgenerateBackupPoms=false
      
      - name: build docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/java_image:1.0.${{ github.run_number }} -t ${{ secrets.DOCKER_USERNAME }}/java_image:latest .

      - name: test image
        run: docker run --rm ${{ secrets.DOCKER_USERNAME }}/java_image:1.0.${{ github.run_number }} | grep -q "Hello World!" && echo "Success" || exit 1
        

      - name: log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: push to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java_image:1.0.${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/java_image:latest
