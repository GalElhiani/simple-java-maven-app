name: github actions + docker project

on:
  push:
    branches: [ "AWS" ]
  pull_request:
    branches: [ "AWS" ]
  

jobs:
  build-test:
    runs-on: [self-hosted, linux]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: set version
        run: mvn -B versions:set -DnewVersion=1.0.${{ github.run_number }} -DgenerateBackupPoms=false

      
      - name: build docker image
        run: docker build -t 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:1.0.${{ github.run_number }} -t 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:latest .


      - name: test image
        run: docker run --rm 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:1.0.${{ github.run_number }} | grep -q "Hello World!" && echo "Success" || exit 1


      - name: log in to ECR
        run: aws ecr get-login-password --region eu-west-1 --profile ecr-push | docker login --username AWS --password-stdin 581351186844.dkr.ecr.eu-west-1.amazonaws.com


      - name: push to ECR
        run: |
          docker push 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:1.0.${{ github.run_number }}
          docker push 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:latest
        
        #remove local image to force docker run to pull it from ecr
      - name: remove local image
        run: |
          docker rmi 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:1.0.${{ github.run_number }}
          docker rmi 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:latest

      - name: deploy test
        run: docker run --rm 581351186844.dkr.ecr.eu-west-1.amazonaws.com/github-actions/aws-pipeline:1.0.${{ github.run_number }} | grep -q "Hello World!" && echo "Success" || exit 1
